# ply-web — build plybox.sh (site + docs), release the image, publish it.
# Prod runs the `plybox` stack whose web member is `ply/ply-web`: this job
# pushes each build to that namespace, and the reconcile timer resolves the
# newest version within a minute. Nothing on the host is edited to deploy —
# no URL to bump, no version pinned anywhere but here.
# Docs, install.sh and the agent skill live in the ply repo (beside the
# code they document) and are checked out alongside at build time.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest    # x64: matches the droplet
    steps:
      # the exact layout local dev has: ply checked out, this repo AS its
      # app/ dir — ../docs, ../install.sh, ../scripts, ../skills all real
      - uses: actions/checkout@v4
        with: { repository: iluxav/ply, path: ply }
      - uses: actions/checkout@v4
        with: { path: ply/app }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }

      - name: version guard (tag == ply.toml)
        working-directory: ply/app
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' ply.toml | head -1)
          test "v$V" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != ply.toml v$V"; exit 1; }

      - name: build site
        working-directory: ply/app
        run: |
          npm ci
          npm run build

      - name: build image
        id: img
        run: |
          curl -fsSL https://i.plybox.sh/install.sh | PLY_WIZARD=no sh
          cd ply/app
          ply build .
          img=$(ls plybox-web-*-linux-*.img | head -1)
          echo "image=ply/app/$img" >> "$GITHUB_OUTPUT"

      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${{ steps.img.outputs.image }}" \
            --title "plybox.sh $GITHUB_REF_NAME" \
            --notes "site image — prod resolves it from the registry on its next reconcile beat" || \
          gh release upload -R "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${{ steps.img.outputs.image }}"

      # A runner cannot do the device flow, so it publishes with a key.
      # This is what the stack's `run = "ply/ply-web"` member resolves.
      - name: publish to the registry
        env:
          PLY_TOKEN: ${{ secrets.PLY_TOKEN }}
        run: |
          test -n "$PLY_TOKEN" || { echo "::error::PLY_TOKEN secret is not set"; exit 1; }
          ply push "${{ steps.img.outputs.image }}" --as ply
