# plybox — the site + its database, as one stack.
#
#   local:  ply up ./stack.toml --env-file ~/plybox.env
#   host:   copy to /var/lib/ply/deployments/plybox.toml (env_file below)
#
# The web member is `ply/ply-web`: CI publishes each build to that
# namespace and the host resolves the newest version on its next reconcile
# beat. Nothing here names a version, so shipping is `make release` alone.

[stack]
name = "plybox"
version = "1.0.0"
description = "plybox.sh — landing, docs, registry UI + API."
env_file = "/etc/ply/plybox.env"

[[app]]
run  = "postgres@17"
name = "plybox-db"
e    = ["POSTGRES_PASSWORD=$POSTGRES_PASSWORD", "POSTGRES_DB=$POSTGRES_DB"]

[[app]]
run     = "ply/ply-web"
name    = "plybox-web"
after   = ["plybox-db"]
publish = ["internal:3000"]
domain  = ["plybox.sh"]
e = [
  # the db member by its bridge name — `after` injects PLYBOX_DB_HOST (named
  # after the MEMBER), not the POSTGRES_HOST this app's contract reads
  "POSTGRES_HOST=plybox-db.ply",
  "PLY_ADMIN_LOGINS=$PLY_ADMIN_LOGINS",
  "POSTGRES_PASSWORD=$POSTGRES_PASSWORD",
  "POSTGRES_DB=$POSTGRES_DB",
  "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID",
  "GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET",
  "R2_ACCOUNT_ID=$R2_ACCOUNT_ID",
  "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID",
  "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY",
]
